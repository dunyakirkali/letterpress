---
# Asciidoctor PDF theme for UOC assignments and deliveries.
#
# Based on 'default-for-print'
# https://github.com/asciidoctor/asciidoctor-pdf/blob/main/data/themes/default-for-print-theme.yml

extends: default-for-print
font:
  catalog:
    merge: true
    Text:
      normal: GEM_FONTS_DIR/notoserif-regular-subset.ttf
      bold: GEM_FONTS_DIR/notoserif-bold-subset.ttf
      italic: GEM_FONTS_DIR/notoserif-italic-subset.ttf
      bold_italic: GEM_FONTS_DIR/notoserif-bold_italic-subset.ttf
    Headings:
      normal: GEM_FONTS_DIR/notosans-regular-subset.ttf
      italic: GEM_FONTS_DIR/notosans-italic-subset.ttf
      bold: GEM_FONTS_DIR/notosans-bold-subset.ttf
      bold_italic: GEM_FONTS_DIR/notosans-bold_italic-subset.ttf
    Mono:
      normal: GEM_FONTS_DIR/mplus1mn-regular-subset.ttf
      italic: GEM_FONTS_DIR/mplus1mn-italic-subset.ttf
      bold: GEM_FONTS_DIR/mplus1mn-bold-subset.ttf
      bold_italic: GEM_FONTS_DIR/mplus1mn-bold_italic-subset.ttf
base:
  font_family: Text
  font_size: 12
section:
  indent: [1in, 0]
heading:
  font_family: Headings
  font_style: bold
  # Prevent orphan headings.
  # https://docs.asciidoctor.org/pdf-converter/latest/breakable-and-unbreakable/#section-or-discrete-heading
  min-height-after: auto
  h2:
    font_size: $base-font-size * 3
  h3:
    padding: [0,0,0,-0.5in]
code:
  font_family: Mono
  font_size: 75%
  font_size_min: 3
codespan:
  font_family: Mono
  font_size: 90%
kbd_font_family:
  font_family: Mono
  font_size: 85%
btn_font_family:
  font_family: Mono
  font_size: 85%
table:
  font_size: 85%
title_page:
  title:
    font_family: Headings
    font_size: $base_font_size * 8
    text_transform: uppercase
    font_style: bold
  subtitle:
    font_family: Headings
    font_style: normal
    font_size: $base_font_size * 1.25
  authors:
    font_family: Headings
    font_size: $base_font_size * 0.75
    margin-top: 180
    content:
      name_only: |-
        {author}
        #{student_id}
      with_email: |-
        {author}
        `<{email}>`
        #{student_id}
page:
  margin: [1in, 1in, 1in, 1in]
quote:
  font_color: 666666
  font_size: $base_font_size_small
header:
  height: $base_line_height_length * 4.0
  font_color: 666666
  border_color: dddddd
  border_width: .5
  line_height: 1.5
  padding: [$base_line_height_length / 2, 1, 0, 1]
  vertical_align: bottom
  margin: [0, 1in]
  content-margin: [0, auto]
  recto: &common-header
    left:
      content: '{document-subtitle}'
    right:
      content: '{document-title} » {chapter-title}'
  verso: *common-header
footer:
  height: 0.75in
  font_color: 666666
  border_color: dddddd
  border_width: .5
  margin: [0, 1in]
  content-margin: [0, auto]
  recto: &common-footer
    left:
      content: |-
        {author}
        `<{email}>`
    right:
      content: '{page-number}'
  verso: *common-footer
