# Styles are committed under StylesPath (no `vale sync` needed), so lint is
# reproducible offline and in CI. To update one, copy the new release in.
# Only errors fail the build; see warnings with `vale --minAlertLevel=warning source/`.
StylesPath = .github/styles

MinAlertLevel = error

Vocab = letterpress

[asciidoctor]
experimental = YES

[*]
BasedOnStyles = Vale, Google, proselint, write-good, Readability
